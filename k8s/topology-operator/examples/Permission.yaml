# https://www.rabbitmq.com/kubernetes/operator/using-topology-operator#user-permissions-obj
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: my-admin-user-permission
  # namespace: rabbitmq-dev
spec:
  vhost: "/prod"
  user: "my-admin-user" # name of the RabbitMQ user
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: rabbitmq-cluster
    namespace: rabbitmq
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: my-hash-user-permission
  # namespace: rabbitmq-dev
spec:
  vhost: "/test"
  user: "my-hash-user" # name of the RabbitMQ user
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: rabbitmq-cluster
    namespace: rabbitmq
