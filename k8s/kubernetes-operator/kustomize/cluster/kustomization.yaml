apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# - namespace.yaml
# - issuer.yaml
# - certificate.yaml
- secret.yaml  # enable also spec.secretBackend.externalSecret in cluster.yaml
- cluster.yaml
- istio.yaml

generatorOptions:
  disableNameSuffixHash: true

