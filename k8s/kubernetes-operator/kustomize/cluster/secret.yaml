apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-cluster-default-user-external
type: Opaque
stringData:
  default_user.conf: |
    default_user = admin
    default_pass = admin
  host: rabbitmq-cluster.default.svc
  username: admin
  password: admin
  connection_string: amqp://admin:admin@rabbitmq-cluster.default.svc:5672/
  port: "5672"
  stream-port: "5552"
  provider: rabbitmq
  type: rabbitmq
