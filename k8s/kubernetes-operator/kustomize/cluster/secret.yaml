apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-cluster-additional-config
type: Opaque
# Static secret example. Uncomment this file in kustomization.yaml only if you want
# to manage the external secret manifest directly instead of using secretGenerator.
stringData:
  # RabbitMQ server configuration (rabbitmq.conf) applied inside the broker.
  default_user.conf: |
    default_user = admin
    default_pass = admin
  # Standard credential key expected by applications/operators/controllers.
  username: admin
  password: admin
  host: rabbitmq-cluster.rabbitmq-system.svc
  connection_string: amqp://admin:admin@rabbitmq-cluster.rabbitmq-system.svc:5672/
  port: "5672"
  stream-port: "5552"
  provider: rabbitmq
  type: rabbitmq
