apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rabbitmq-cluster
spec:
  rules:
  - host: rabbitmq-192.168.0.100.nip.io
    http:
      paths:
      - backend:
          service:
            name: rabbitmq-cluster
            port:
              number: 15672
        path: /
        pathType: Prefix
