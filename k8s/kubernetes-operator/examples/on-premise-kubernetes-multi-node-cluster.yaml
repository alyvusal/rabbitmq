# https://medium.com/@paolo.gazzola/deploy-a-rabbitmq-cluster-in-an-on-premise-kubernetes-multi-node-cluster-enviroment-5dd71d84dafc
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: network-rabbitmq-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv1
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: network-rabbitmq-storage
  hostPath:
    path: "/mnt/k8shared/rabbitmq"
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8worker
          - k8wnode1
          - k8wnode2
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv2
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: network-rabbitmq-storage
  hostPath:
    path: "/mnt/k8shared/rabbitmq"
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8worker
          - k8wnode1
          - k8wnode2
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: rabbitmq-pv3
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Recycle
  storageClassName: network-rabbitmq-storage
  hostPath:
    path: "/mnt/k8shared/rabbitmq"
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8worker
          - k8wnode1
          - k8wnode2
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  namespace: rabbitmq-system
  name: rabbitmq-test-ready
spec:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  rabbitmq:
    additionalConfig: |
      log.console.level = info
      default_user= guest
      default_pass = guest
      default_user_tags.administrator = true
  persistence:
    storageClassName: network-rabbitmq-storage
    storage: 5Gi
  service:
    type: LoadBalancer
  override:
    service:
      spec:
        ports:
        - port: 5672
          targetPort: 5672
        externalIPs:
        - x.y.z.1
        - x.y.z.2
        - x.y.z.3
